global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "sherlog-api"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "sherlog-orders"
    static_configs:
      - targets: ["orders:8001"]

  - job_name: "sherlog-payments"
    static_configs:
      - targets: ["payments:8002"]

  - job_name: "sherlog-fault-injector"
    static_configs:
      - targets: ["fault-injector:8003"]
